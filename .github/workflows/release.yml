name: Draft release
on:
  push:
    tags: ['*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: node scripts/release-notes.mjs > dist/release-notes.md
      - name: Create draft with installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/main.js dist/manifest.json dist/styles.css --draft --verify-tag --title "Recent Changes $RELEASE_TAG" --notes-file dist/release-notes.md
